<!DOCTYPE html>
<head>
    <title>Navigation Menu Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 align="center">Navigation Menu Demo</h1>
    <h2>Block Example</h2>
    <ul class="block">
        <li>Home</li>
        <li>Products</li>
        <li>About</li>
        <li>Contact</li>
    </ul>
    <h2>Inline Example</h2>
    <ul class="inline">
        <li>Home</li>
        <li>Products</li>
        <li>About</li>
        <li>Contact</li>
    </ul>
    <h2>Inline-Block Example</h2>
    <ul class="inlineblock">
        <li>Home</li>
        <li>Products</li>
        <li>About</li>
        <li>Contact</li>
    </ul>
    <h2>Float Example</h2>
    <ul class="floatmenu">
        <li>Home</li>
        <li>Products</li>
        <li>About</li>
        <li>Contact</li>
    </ul>
    <div class="clear"></div>
</body>
</html>
