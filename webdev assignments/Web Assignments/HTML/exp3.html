<!DOCTYPE html>
<html lang="en">
<head>
    <title>Basic Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightgrey;
            text-align: center;
        }

        h2 {
            color: darkblue;
        }

        table {
            border-collapse: collapse;
            margin: 20px auto;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            width: 100px;
        }

        th {
            background-color: cyan;
        }

        .open {
            background-color: blue;
            color: red;
        }

        .closed {
            background-color: pink;
            color: purple;
        }

        .timing {
            background-color: lightgreen;
            color: darkgreen;
        }
    </style>
</head>

<body>

    <h2>Simple Table Example</h2>

    <table>
        <tr>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
            <th>Saturday</th>
            <th>Sunday</th>
        </tr>

        <tr align="center">
            <td colspan="6" class="open">Open</td>
            <td rowspan="2" class="closed">Closed</td>
        </tr>

        <tr align="center" class="timing">
            <td>11:00-6:00</td>
            <td>11:00-22:00</td>
            <td>11:00-6:00</td>
            <td>11:00-22:00</td>
            <td>11:00-6:00</td>
            <td>11:00-22:00</td>
        </tr>

    </table>

</body>
</html>
