<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            background-color: lightgrey;
            font-family: Arial, sans-serif;
        }

        form {
            background-color: white;
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid darkblue;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: darkblue;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            width: 95%;
            padding: 6px;
            margin-top: 5px;
        }

        button {
            padding: 8px 15px;
            margin: 10px;
            background-color: darkblue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

    <form action="/submit-form.php" method="post">

        <h2>Student Registration Form</h2>
        <hr>

        <label>Full Name:</label><br>
        <input type="text" placeholder="Enter your full name" required><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email" required><br><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Enter your password" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
        <br><br>

        <label>Course:</label><br>
        <select required>
            <option>---- Select Course ----</option>
            <option>Python</option>
            <option>Java</option>
            <option>React</option>
            <option>PHP</option>
            <option>C++</option>
        </select>
        <br><br>

        <label>Contact No:</label><br>
        <input type="tel" placeholder="Enter phone number" required><br><br>

        <label>Address:</label><br>
        <textarea rows="4" placeholder="Enter your address"></textarea><br><br>

        <button type="submit">Register</button>
        <button type="reset">Close</button>

        <hr>

    </form>

</body>
</html>
