<!DOCTYPE html>
<html>
    <head>
        <title>Navigation Bar</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
            }
            .block li{
                display: block;
                background-color: blue;
                color: darkblue;
                padding:10px;
                margin-bottom: 10px;
            }
            .inline li{
                display: inline;
                background-color: orange;
                color:red;
                padding:10px;
            }
            .Inblo li{
                padding:10px;
                display: inline-block;
                background-color: green;
                color:darkgreen;
                height: 200px;
                width: 300px;
            }
            .flo li{
                padding: 10px;
                float:right;
                margin-left: 10px;
                background-color: pink;
                color:magenta;
            }
            h1{
                color: red;
                box-shadow: 5px 5px 5px cyan,-5px -5px 3px blue;
            }
        </style>
    </head>
    <body >
        
    <h1 align ="center">Navigation</h1>
    <h2>Block Example</h2>
    <ul class="block">
        <li>Home</li>
        <li>Products</li>
        <li>About</li>
        <li>Contact</li>
    </ul>
    <h2>Inline Example</h2>
    <ul class="inline">
        <li>Home</li>
        <li>Products</li>
        <li>About</li>
        <li>Contact</li>
    </ul>
    <h2>Inline-Block Example</h2>
    <ul class="Inblo">
        <li>Home</li>
        <li>Products</li>
        <li>About</li>
        <li>Contact</li>
    </ul>
    <h2>Float Example</h2>
    <ul class="flo">
        <li>Home</li>
        <li>Products</li>
        <li>About</li>
        <li>Contact</li>
    </ul>

    </body>
</html>
